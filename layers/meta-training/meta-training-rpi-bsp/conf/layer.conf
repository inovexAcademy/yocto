# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-training-rpi-bsp"
BBFILE_PATTERN_meta-training-rpi-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-training-rpi-bsp = "11"

LAYERDEPENDS_meta-training-rpi-bsp = "core raspberrypi"
LAYERSERIES_COMPAT_meta-training-rpi-bsp = "wrynose"

