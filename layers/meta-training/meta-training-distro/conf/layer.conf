# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-training-distro"
BBFILE_PATTERN_meta-training-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-training-distro = "11"

LAYERDEPENDS_meta-training-distro = "core"
LAYERSERIES_COMPAT_meta-training-distro = "scarthgap"

