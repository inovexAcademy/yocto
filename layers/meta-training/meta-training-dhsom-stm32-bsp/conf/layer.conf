# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-training-dhsom-stm32-bsp"
BBFILE_PATTERN_meta-training-dhsom-stm32-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-training-dhsom-stm32-bsp = "11"

LAYERDEPENDS_meta-training-dhsom-stm32-bsp = "core dhsomstm32bsp"
LAYERSERIES_COMPAT_meta-training-dhsom-stm32-bsp = "scarthgap"
