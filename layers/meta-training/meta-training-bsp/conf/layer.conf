# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-training-bsp"
BBFILE_PATTERN_meta-training-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-training-bsp = "11"

LAYERDEPENDS_meta-training-bsp = "core"
LAYERSERIES_COMPAT_meta-training-bsp = "scarthgap"

LAYERDEPENDS_meta-training-bsp = " \
"
