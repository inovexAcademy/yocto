header:
  version: 21

distro: training-distro
target:
  - training-image
  - core-image-minimal

defaults:
  repos:
    branch: wrynose

repos:
  meta-training:
    path: "layers/meta-training"
    layers:
      meta-training:
        prio: 10
      meta-training-distro:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/openembedded-core/bitbake
    branch: "2.18"
    layers:
      bitbake: disabled

local_conf_header:
  oe-config-fragments: |
    # OE_FRAGMENTS
    # Yocto's new fragments concept is pretty cool and great, but
    # `addfragments` picks up fragments before the distro is parsed.
    # For the most currently available fragments, the distro
    # is one logical place to use them, while taking advantage of
    # the shared and maintained config fragment.
    # Until this issue is fixed, generally enabled fragments are added
    # here for now:

    # Utilize Yocto's SBoM CVE checker
    require conf/distro/include/cve-extra-exclusions.inc
    OE_FRAGMENTS += "core/yocto/sbom-cve-check"
    SBOM_CVE_CHECK_EXTRA_ARGS += "--sbom-path ${DEPLOY_DIR_IMAGE}/${IMAGE_LINK_NAME}.spdx.json"

    # Use prebuilt sstate artifacts for standard Yocto build configurations:
    # OE_FRAGMENTS += "core/yocto/sstate-mirror-cdn"

  diskmon: |
    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

  mender-base: |
    CONF_VERSION = "2"
    MENDER_ARTIFACT_NAME = "YOCTO_RELEASE"

