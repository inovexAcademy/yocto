header:
  version: 18

distro: training-distro
target: training-image

defaults:
  repos:
    branch: scarthgap

repos:
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/openembedded-core/bitbake
    branch: "2.8"
    layers:
      bitbake: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    path: "layers/meta-mender"
    layers:
      meta-mender-core:

  meta-training:
    path: "layers/meta-training"
    layers:
      meta-training:
      meta-training-bsp:
      meta-training-distro:

local_conf_header:
  mender-base: |
    CONF_VERSION = "2"
    MENDER_ARTIFACT_NAME = "scarthgap-date"

