header:
  version: 21

distro: training-distro
target:
  - training-image
  - core-image-minimal

defaults:
  repos:
    branch: scarthgap

repos:
  meta-training:
    path: "layers/meta-training"
    layers:
      meta-training:
        prio: 10
      meta-training-distro:

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    path: "layers/meta-mender"
    layers:
      meta-mender-core:
        prio: 5
      meta-mender-demo: disabled

  meta-vulnscout:
    url: https://github.com/savoirfairelinux/meta-vulnscout.git
    path: "layers/meta-vulnscout"

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/openembedded-core/bitbake
    branch: "2.8"
    layers:
      bitbake: disabled

local_conf_header:
  diskmon: |
    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

  mender-base: |
    CONF_VERSION = "2"
    MENDER_ARTIFACT_NAME = "scarthgap-date"

