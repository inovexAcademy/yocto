stages:
  - build
  - publish_sbom
  - cve_scan

# Global CI configuration is split across several files. This entrypoint only
# defines the stage order and pulls in the pieces:
#   - ci/templates/build-yocto.yml     : generic build templates (.setup_build, .build_*)
#   - ci/templates/publish-sbom.yml    : SBOM publishing template (.publish_sbom)
#   - ci/templates/vulnscout-scan.yml  : scan templates (.scan_vulnscout, .cve_scan)
#   - ci/devices/<name>.yml            : per-device vars + concrete build/publish/scan jobs

include:
  - local: 'ci/templates/build-yocto.yml'
  - local: 'ci/templates/publish-sbom.yml'
  - local: 'ci/templates/vulnscout-scan.yml'
  - local: 'ci/devices/rpi3.yml'
  # - local: 'ci/devices/rpi4.yml'

