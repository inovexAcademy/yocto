stages:
  - build
  - publish_sbom
  - cve_scan

# Generic build templates
# =============================================================================
.setup_build:
    image: ghcr.io/siemens/kas/kas:5.4
    tags:
        - yocto-ics
    artifacts:
        expire_in: 3 months
        paths:
            - build/tmp*/deploy/images/*/*.sdimg
            - build/tmp*/deploy/images/*/*.mender
            - build/tmp*/deploy/images/*/*.spdx*

.build_yocto:
    extends: .setup_build
    stage: build
    script:
        - echo "Starting KAS Yocto build"

        # Only checkout the layers configured.
        - kas checkout config/${DEVICE_YAML}

        # Include an build artifact identifier for the .mender artifact name
        # (placeholder token: YOCTO_RELEASE).
        #   - Tag pipelines:  "<release line>-<tag>"    e.g. "wrynose-v1.2.0"
        #   - Branch / MR:    "<release line>-<branch>-<timestamp>"
        # The release line is read from config/base.yml's defaults.repos.branch.
        - |
          set -eu
          release_line=$(python3 -c 'import yaml; print((yaml.safe_load(open("config/base.yml")) or {}).get("defaults",{}).get("repos",{}).get("branch",""))')

          if [ -z "$release_line" ]; then
            echo "ERROR: could not read defaults.repos.branch from config/base.yml."
            exit 1
          fi

          if [ -n "${CI_COMMIT_TAG:-}" ]; then
            version_string="${release_line}-${CI_COMMIT_TAG}"
          else
            version_string="${release_line}-${CI_COMMIT_REF_SLUG}-${CI_JOB_STARTED_AT}"
          fi
          echo "Stamping Yocto release identifier: ${version_string}"
          sed -i "s#YOCTO_RELEASE#${version_string}#" config/base.yml

        # Start actual build
        - kas build config/${DEVICE_YAML}
        - echo "Yocto build finished."

.build_debug:
  extends: .build_yocto
  cache:
    key: "yocto-sstate-${DEVICE_ID}"
    paths:
      - build/cache
      - build/sstate-cache
  rules:
    - if: $CI_COMMIT_TAG == null || $CI_COMMIT_TAG == ""
    - when: manual
      allow_failure: true
  variables:
    DEVICE_YAML: "${DEVICE_BASE_YAML}:config/debug.yml"

# Release builds: run on tag pipelines (or manually), no sstate cache to
# guarantee a clean, reproducible release build.
.build_release:
  extends: .build_yocto
  cache:
    key: no_cache
    paths:
      - .do-not-cache
  rules:
    - if: $CI_COMMIT_TAG != null
      when: always
    - when: manual
      allow_failure: true
  variables:
    DEVICE_YAML: "${DEVICE_BASE_YAML}"


# SBOM publishing template
#
# Uploads every SPDX/SBOM file produced by the release build to the project's
# Generic Package Registry under ${PACKAGE_NAME}/${PACKAGE_VERSION}.
#
# The file names created here are consumed 1:1 by the cve_scan
# jobs. The SPDX <-> CVE-check pairing in cve_scan relies on the
# ".spdx.json" / ".sbom-cve-check.spdx.json" suffixes being preserved, so do
# NOT rewrite the file extensions when changing the upload naming below.
.publish_sbom:
  stage: publish_sbom
  tags:
    - yocto-ics
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG != null
      when: on_success
  variables:
    PACKAGE_VERSION: $CI_COMMIT_TAG
    # PACKAGE_NAME is provided by the device template.
    REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"
  script:
    - echo "Searching for SPDX/SBOM files under build/tmp*/deploy/images/*/..."
    - |
      set -eu
      # curl cannot expand shell wildcards, so we expand the glob ourselves
      # in a for loop and upload every matching file individually.
      # "*.spdx.json" intentionally also matches "*.sbom-cve-check.spdx.json" -
      # we want to upload all of these anyway.
      upload_count=0
      for f in build/tmp*/deploy/images/*/*.spdx.json; do
        [ -e "$f" ] || continue
        # The Yocto SPDX base name already encodes image + machine and is
        # therefore unique. We still prefix with the image/machine directory
        # name to keep the origin obvious in the registry.
        variant=$(basename "$(dirname "$f")")
        target_name="${variant}-$(basename "$f")"
        echo "Uploading: $f -> ${target_name}"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${REGISTRY_URL}/${target_name}"
        upload_count=$((upload_count + 1))
      done

      if [ "$upload_count" -eq 0 ]; then
        echo "ERROR: No SPDX/SBOM files found under build/tmp*/deploy/images/*/*.spdx.json."
        exit 1
      fi
      echo "Uploaded ${upload_count} file(s)."

# Generic VulnScout scan template
# Expects SBOM pairs to already be present in ${SBOM_DOWNLOAD_DIR}.
.scan_vulnscout:
  stage: cve_scan
  tags:
    - yocto-ics
  image:
    name: sflinux/vulnscout:v0.18
    entrypoint: [""]
  variables:
    PROJECT_NAME: $CI_PROJECT_NAME
    VARIANT_NAME: default
    OUTPUTS_DIR: $CI_PROJECT_DIR/vulnscout-outputs
    VULNSCOUT_OUTPUTS_DIR: $CI_PROJECT_DIR/vulnscout-outputs
    NVD_API_KEY: $NVDCVE_API_KEY
    # Default location where SBOM pairs to be scanned are expected.
    SBOM_DOWNLOAD_DIR: "${CI_PROJECT_DIR}/sboms"
  cache:
    key: vulnscout-vulnerability-db
    paths:
      - .vulnscout-cache/
  before_script:
    - mkdir -p "$OUTPUTS_DIR"
    - mkdir -p "$CI_PROJECT_DIR/.vulnscout-cache"
    # Symlink VulnScout's internal cache folder to the GitLab runner workspace folder
    # so that downloaded vulnerability databases persist across pipeline runs:
    - rm -rf /cache/vulnscout
    - ln -s "$CI_PROJECT_DIR/.vulnscout-cache" /cache/vulnscout
    # Limit RAM consumption of the Go-based scanners (osv-scanner / grype)
    # to avoid the OOM killer terminating a scan.
    - export GOMEMLIMIT="24GiB"
  script:
    - echo "Starting standalone VulnScout scan for ${PROJECT_NAME} (${VARIANT_NAME})..."

    - |
      set -eu
      # Collect all downloaded SPDX/CVE-check pairs and add each of them
      # to the same project/variant. This way an arbitrary number of image
      # variants/machines is covered in a single scan per release.
      cd "${SBOM_DOWNLOAD_DIR}"
      pair_count=0
      for spdx in *.spdx.json; do
        [ -e "$spdx" ] || continue
        case "$spdx" in
          *.sbom-cve-check.spdx.json) continue ;;
        esac
        cve_check_file="${spdx%.spdx.json}.sbom-cve-check.spdx.json"
        if [ ! -e "$cve_check_file" ]; then
          echo "WARNING: No matching sbom-cve-check file found for ${spdx}, skipping."
          continue
        fi
        echo "Adding SBOM pair: ${spdx} / ${cve_check_file}"
        /scan/src/entrypoint.sh \
          --project "${PROJECT_NAME}" \
          --variant "${VARIANT_NAME}" \
          --add-spdx "${SBOM_DOWNLOAD_DIR}/${spdx}" \
          --add-cve-check "${SBOM_DOWNLOAD_DIR}/${cve_check_file}"
        pair_count=$((pair_count + 1))
      done

      if [ "$pair_count" -eq 0 ]; then
        echo "ERROR: No valid SBOM pairs found in ${SBOM_DOWNLOAD_DIR}."
        exit 1
      fi
      echo "Added ${pair_count} SBOM pair(s) in total."

    - |
      set -e
      /scan/src/entrypoint.sh \
        --project "${PROJECT_NAME}" \
        --variant "${VARIANT_NAME}" \
        --perform-nvd-scan

    - |
      set -e
      /scan/src/entrypoint.sh \
        --project "${PROJECT_NAME}" \
        --variant "${VARIANT_NAME}" \
        --perform-osv-scan

    - |
      set -e
      /scan/src/entrypoint.sh \
        --project "${PROJECT_NAME}" \
        --variant "${VARIANT_NAME}" \
        --perform-sbom-cve-check-scan

    # Disable grype due to current issues with the grype cli tool
    # (excessive memory consumption)
    # - |
    #   set -e
    #   /scan/src/entrypoint.sh \
    #     --project "${PROJECT_NAME}" \
    #     --variant "${VARIANT_NAME}" \
    #     --perform-grype-scan

    - |
      set -e
      /scan/src/entrypoint.sh \
        --project "${PROJECT_NAME}" \
        --variant "${VARIANT_NAME}" \
        --export-spdx \
        --export-cdx \
        --export-openvex \
        --report all_assessments.adoc \
        --report match_condition.adoc \
        --report summary.adoc \
        --report time_estimates.csv \
        --report vulnerabilities.csv \
        --report vulnerability_summary.txt

  artifacts:
    expire_in: 90 days
    when: always
    paths:
      - vulnscout-outputs/

# cve_scan template: downloads all SBOMs for a release from the Generic
# Package Registry (with explicit API pagination) and hands them to the
# generic .scan_vulnscout logic.
#
# Scheduled job!
# The weekly cadence is provided by a configured GitLab Pipeline Schedule
# (CI/CD -> Schedules), e.g. a cron of "0 3 * * 6" for every Saturday at 03:00.
.cve_scan:
  extends: .scan_vulnscout
  needs: []
  rules:
    # Weekly re-scan of released images, driven by the pipeline schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
      allow_failure: true
  variables:
    VARIANT_NAME: $TARGET_RELEASE_VERSION
    # PACKAGE_NAME is provided by the device template.
    PACKAGES_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages"
    # SBOM_DOWNLOAD_DIR is inherited from .scan_vulnscout.
  before_script:
    - !reference [.scan_vulnscout, before_script]

    - |
      set -e
      (apt-get update && apt-get install -y curl jq) \
        || apk add --no-cache curl jq \
        || echo "Package install step failed, will verify tools next."
    - |
      set -e
      command -v curl >/dev/null 2>&1 || { echo "ERROR: curl is not available."; exit 1; }
      command -v jq   >/dev/null 2>&1 || { echo "ERROR: jq is not available."; exit 1; }

    - mkdir -p "${SBOM_DOWNLOAD_DIR}"

    - |
      set -eo pipefail

      # -----------------------------------------------------------------
      # paginate <list-endpoint-url>
      # Walks all pages of a GitLab API list endpoint using the
      # X-Next-Page response header and prints every array element as one
      # compact JSON object per line.
      # -----------------------------------------------------------------
      paginate() {
        base_url="$1"
        case "$base_url" in
          *\?*) sep="&" ;;
          *)    sep="?" ;;
        esac
        page=1
        while : ; do
          headers_file=$(mktemp)
          body=$(curl --fail --silent --show-error \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --dump-header "$headers_file" \
            "${base_url}${sep}per_page=100&page=${page}")
          printf '%s' "$body" | jq -c '.[]'
          # GitLab returns the next page number here, or empty on the last page.
          next=$(awk 'tolower($1) == "x-next-page:" { gsub(/\r/,"",$2); print $2 }' "$headers_file")
          rm -f "$headers_file"
          [ -n "$next" ] || break
          page="$next"
        done
      }

      echo "Looking up package '${PACKAGE_NAME}' version '${TARGET_RELEASE_VERSION}'..."
      # jq -s slurps the streamed objects into an array so we can pick the
      # first match without a SIGPIPE-prone "head".
      package_id=$(paginate "${PACKAGES_API_URL}?package_name=${PACKAGE_NAME}&package_version=${TARGET_RELEASE_VERSION}" \
        | jq -rs --arg name "$PACKAGE_NAME" --arg ver "$TARGET_RELEASE_VERSION" \
            '[.[] | select(.name==$name and .version==$ver)] | .[0].id // empty')

      if [ -z "$package_id" ]; then
        echo "ERROR: No package '${PACKAGE_NAME}' found for version '${TARGET_RELEASE_VERSION}'."
        exit 1
      fi
      echo "Found package_id: ${package_id}"

      echo "Fetching file list for this release (paginated)..."
      paginate "${PACKAGES_API_URL}/${package_id}/package_files" \
        | jq -r '.file_name' \
        | sort -u > "${SBOM_DOWNLOAD_DIR}/.file_list"

      if [ ! -s "${SBOM_DOWNLOAD_DIR}/.file_list" ]; then
        echo "ERROR: No files registered for package_id ${package_id}."
        exit 1
      fi
      echo "Found files:"
      cat "${SBOM_DOWNLOAD_DIR}/.file_list"

      while IFS= read -r fname; do
        [ -n "$fname" ] || continue
        echo "Downloading ${fname}..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${PACKAGES_API_URL}/generic/${PACKAGE_NAME}/${TARGET_RELEASE_VERSION}/${fname}" \
          --output "${SBOM_DOWNLOAD_DIR}/${fname}"
      done < "${SBOM_DOWNLOAD_DIR}/.file_list"
      echo "Download complete."

