stages:
  - build
  - sign

.setup_build:
    image: ghcr.io/siemens/kas/kas:5.2
    tags:
        - yocto-ics
    artifacts:
        expire_in: 3 mos
        paths:
            - build/tmp*/deploy/images/*/*.sdimg
            - build/tmp*/deploy/images/*/*.mender
            - build/tmp*/deploy/images/*/*.spdx*

.build_yocto:
    extends: .setup_build

    script:
        - echo "Starting KAS Yocto build"

        # checkout layers depending on the device configuration
        - kas checkout config/${DEVICE_YAML}

        # modify sources depending on build type
        - sed -i "s#scarthgap-date#scarthgap-${CI_JOB_STARTED_AT}#" config/base.yml

        # Start actual build
        - kas build config/${DEVICE_YAML}
        - echo "Yocto build finished."


build_rpi3_debug:
  extends: .build_yocto
  stage: build
  cache:
      key: YOCTO_BUILD_CACHE
      paths:
          - build/cache
          - build/sstate-cache
  rules:
      - if: $CI_COMMIT_TAG == null || $CI_COMMIT_TAG == ""
      - when: manual
        allow_failure: true

  variables:
    DEVICE_YAML:    "raspberrypi3.yml:config/debug.yml"

build_rpi3_release:
  extends: .build_yocto
  stage: build
  cache:
      key: no_cache
      paths:
          - .do-not-cache
  rules:
    - if: $CI_COMMIT_TAG != null
      when: always
    - when: manual
      allow_failure: true

  variables:
    DEVICE_YAML:    "raspberrypi3.yml"

