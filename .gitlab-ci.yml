stages:
  - build
  - sign

.setup_build:
    image: ghcr.io/siemens/kas/kas:4.7
    variables:
      KAS_SSH_DIR: "${PWD}/deploy-key"
      KAS_SSH_AUTH_SOCK: $(readlink -fv "$SSH_AUTH_SOCK")
    tags:
        - local_cache
    before_script:
        - eval $(ssh-agent -s)
        - cat deploy-key/deploy-key | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -p 2424 gitlab.inovex.de >> ~/.ssh/known_hosts
    artifacts:
        expire_in: 3 mos
        paths:
            - build/tmp-glibc/deploy/images/*/*.sdimg
            - build/tmp-glibc/deploy/images/*/*.mender
            - build/tmp-glibc/deploy/images/*/*.spdx*

.build_yocto:
    extends: .setup_build

    script:
        - echo "Starting KAS Yocto build"

        # checkout layers depending on the device configuration
        - kas checkout config/${DEVICE_YAML}

        # modify sources depending on build type
        - sed -i "s#scarthgap-date#scarthgap-${CI_JOB_STARTED_AT}#" config/base.yml

        # Start actual build
        - kas build config/${DEVICE_YAML}
        - echo "Yocto build finished."


build_rpi3_debug:
  extends: .build_yocto
  stage: build
  cache:
      key: YOCTO_BUILD_CACHE
      paths:
          - build/cache
          - build/sstate-cache
  rules:
      - if: $CI_COMMIT_TAG == null || $CI_COMMIT_TAG == ""
      - when: manual
        allow_failure: true

  variables:
    DEVICE_YAML:    "raspberrypi3.yml:config/debug.yml"

build_rpi3_release:
  extends: .build_yocto
  stage: build
  cache:
      key: no_cache
      paths:
          - .do-not-cache
  rules:
    - if: $CI_COMMIT_TAG != null
      when: always
    - when: manual
      allow_failure: true

  variables:
    DEVICE_YAML:    "raspberrypi3.yml"

sign_mender_artifact:
    image: ghcr.io/siemens/kas/kas:4.7
    tags:
        - local_cache
    stage: sign
    script:
        - sign/sign.sh "build/tmp-glibc/deploy/images" "${ARTIFACT_SIGN_KEY}"
    artifacts:
        expire_in: 1 mos
        paths:
            - sign/signed_output

